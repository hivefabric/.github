site_name: HiveFabric Documentation
site_url: https://yourusername.github.io/hive-docs
docs_dir: public
theme:
  name: material
  palette:
    scheme: default
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts: concepts.md
  - Architecture: architecture.md
  - Release Notes: release-notes.md
  - Components:
      - Honeycomb Control Plane: components/control-plane-service.md
      - Control Plane UI: components/control-plane-ui.md
      - Hive App: components/hive-app.md
      - Tenant Gateway: components/hive-tenant-gateway.md
      - MCP Gateway: components/hive-mcp-gateway.md
      - Hive Ledger: components/hive-ledger.md
      - Hive Models: components/hive-models.md
      - Hive SDK: components/hive-sdk.md
      - Comb Node Runtime: components/comb-node.md
  - APIs: apis.md
  - Executors: executors.md
  - Roadmap: roadmap.md
  - FAQ: faq.md
  - Glossary: glossary.md
markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - codehilite
plugins:
  - search
