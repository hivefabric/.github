site_name: HiveFabric Documentation
site_url: https://yourusername.github.io/hive-docs
docs_dir: public
theme:
  name: material
  palette:
    scheme: default
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts: concepts.md
  - Architecture: architecture.md
  - Components:
      - Control Plane Service: components/control-plane-service.md
      - Control Plane UI: components/control-plane-ui.md
      - Comb Node Runtime: components/comb-node.md
      - Hive SDK: components/hive-sdk.md
      - Apiary Market: components/apiary-market.md
      - Honeycomb Runtime: components/honeycomb-runtime.md
  - APIs: apis.md
  - Executors: executors.md
  - Roadmap: roadmap.md
  - FAQ: faq.md
  - Glossary: glossary.md
markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - codehilite
plugins:
  - search
